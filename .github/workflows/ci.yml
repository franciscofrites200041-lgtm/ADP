name: CI

on:
  pull_request:
  push:
    branches: [main]

# One run per branch; a new push cancels the previous one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # The integration suites refuse anything but 127.0.0.1/middleware_test
      # (they are the cross-tenant and secret-redaction ones), so the service
      # database must use exactly that name; the init script creates it.
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: middleware
          POSTGRES_PASSWORD: middleware
          POSTGRES_DB: middleware
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U middleware -d middleware"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://middleware:middleware@127.0.0.1:5432/middleware_test
    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json's `packageManager`; declaring it here
      # too makes the action fail with "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Create the disposable test database
        run: psql "postgres://middleware:middleware@127.0.0.1:5432/middleware" -f infra/postgres/init-test-database.sql

      # §14: the migrations run once, before the suite. The adapters' tests use
      # the real tables, not an empty database.
      - name: Migrate the test database
        run: pnpm --filter @middleware/db db:migrate:apply "$DATABASE_URL_TEST"

      # Unit tests, integration tests against the service database, lint and
      # typecheck. A missing DATABASE_URL_TEST fails on purpose (see
      # apps/api/src/integration-env.test.ts), so the security suites cannot
      # disappear silently.
      - name: Typecheck, lint and test
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test

      - name: Build the web app
        run: pnpm --filter @middleware/web build

      # The browser is the only place three defects this session were visible:
      # a component error boundary, a form that crashed at render, and a chat
      # screen that lost the answer on reload. Nothing above catches those.
      - name: Install the browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end and smoke in a real browser
        # The master key is generated per run: a fixed one in the repository
        # would be a committed secret, and this one only has to unwrap keys
        # the same run's API creates.
        run: |
          export MW_MASTER_KEY="$(node -e \
            'process.stdout.write(require("node:crypto").randomBytes(32).toString("base64"))')"
          pnpm exec playwright test
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_TEST }}
          E2E_API_DATABASE_URL: ${{ env.DATABASE_URL_TEST }}
          BETTER_AUTH_SECRET: ci-only-secret-not-used-in-production-0000
          # The public origin of the app, not the API's port: it is what the
          # browser sends as Origin and what `requireOrigin` allows (as in
          # infra/env.demo.example). With 3001 here every write answered 403.
          BETTER_AUTH_URL: http://localhost:3000
          SMTP_URL: smtp://localhost:1025
          MAIL_FROM: Middleware <no-reply@localhost>
          MW_MASTER_KEY_VERSION: v1

      # The boundaries a diff cannot show: core cannot reach the adapters, the
      # web cannot reach the database. See docs/ci.md.
      - name: Architecture
        run: pnpm arch

      - name: Unused code and dependencies
        run: pnpm knip
